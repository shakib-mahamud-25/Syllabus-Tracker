<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Syllabus Tracker</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f27;--mu:#6b7280;--bd:#e2e5ea;--ac:#2b4c7e;--acs:#e6edf7;--dg:#b3392f;--ok:#2f7d5b;--r:10px}
[data-theme=dark]{--bg:#14171c;--card:#1c2028;--tx:#e8eaee;--mu:#9aa1ad;--bd:#2c323d;--ac:#8fb0e6;--acs:#233049;--dg:#ee7b6f;--ok:#6cc59c}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Bengali","Nirmala UI",Kalpurush,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{display:flex;min-height:100vh}
#side{width:188px;padding:18px 10px;border-right:1px solid var(--bd);background:var(--card);display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;padding:4px 10px 16px;font-size:15px}
.nv{background:none;border:0;text-align:left;padding:8px 10px;border-radius:8px;color:var(--mu)}
.nv:hover{background:var(--bg)}
.nv.on{background:var(--acs);color:var(--ac);font-weight:600}
.gear{margin-top:auto}
main{flex:1;min-width:0;padding:22px 28px 60px;max-width:1180px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
.acts,.acts2,.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn,.btn2,.ib{border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:#fff;padding:6px 12px}
[data-theme=dark] .btn{color:#10151d}
.btn2{background:var(--card);color:var(--tx);border-color:var(--bd)}
.btn2:hover{border-color:var(--ac)}
.ib{background:none;border:0;color:var(--mu);padding:2px 6px}
.ib:hover{color:var(--ac)}
.ib.x:hover{color:var(--dg)}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 9px}
textarea{width:100%;min-height:60px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:14px}
.grid .card{margin:0}
.mu,small{color:var(--mu)}
.bad{color:var(--dg)}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center;flex:none}
.ring span{background:var(--card);width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px}
.flex{display:flex;gap:16px;align-items:center}
.bar{height:7px;background:var(--bd);border-radius:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar i.sk{opacity:.4;background-image:repeating-linear-gradient(45deg,transparent 0 3px,rgba(255,255,255,.7) 3px 5px)}
.lr{display:grid;grid-template-columns:1fr 44px;gap:4px 10px;align-items:center;margin:9px 0}
.lr b{font-weight:500}
.lr .bar{grid-column:1/3}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:4px 10px;color:var(--mu)}
.seg button.on{background:var(--acs);color:var(--ac);font-weight:600}
.pill{font-style:normal;font-size:11px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:0 7px;margin-left:5px;font-weight:400;color:var(--mu)}
.st-ok{color:var(--ok)}.st-bad{color:var(--dg)}
.cnts{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.cnts div{font-size:12px;color:var(--mu)}
.cnts b{display:block;font-size:18px;color:var(--tx)}
.empty{text-align:center;padding:60px 16px;background:var(--card);border:1px dashed var(--bd);border-radius:var(--r)}
.row{display:flex;align-items:center;gap:6px;padding:5px 6px 5px calc(6px + var(--d)*22px);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.row:hover{background:var(--acs)}
.tree{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.tg{border:0;background:none;width:22px;color:var(--mu)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.nm{flex:1;min-width:140px;display:flex;flex-direction:column}
.nm small{font-size:11px}
.rp{width:120px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.rp .bar{flex:1}
.row select{font-size:12px;padding:3px 6px}
.ra{display:flex}
.list>div{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.list>div:last-child{border:0}
.ck{width:18px;height:18px;border:1.5px solid var(--mu);border-radius:5px;background:none;padding:0;font-size:11px;line-height:1;flex:none;color:#fff}
.ck.on,.chip.dn .ck{background:var(--ok);border-color:var(--ok)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.cal.d1{grid-template-columns:1fr}
.cell{background:var(--card);min-height:96px;padding:4px;min-width:0}
.cal.d1 .cell{min-height:200px}
.cell.oth{background:var(--bg)}
.cell.today .dn{background:var(--ac);color:#fff}
.cell.over{outline:2px dashed var(--ac);outline-offset:-2px}
.ch{display:flex;justify-content:space-between;font-size:11px;color:var(--mu)}
.dn{border:0;background:none;border-radius:6px;min-width:22px;height:22px;font-size:12px}
.hd{background:var(--card);text-align:center;font-size:11px;color:var(--mu);padding:4px}
.chip{display:flex;gap:4px;align-items:center;font-size:11px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));border-radius:5px;padding:2px 4px;margin-top:2px;cursor:grab;overflow:hidden}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.chip .ck{width:13px;height:13px;font-size:9px}
.chip.dn span{text-decoration:line-through;opacity:.6}
.chip.od{background:color-mix(in srgb,var(--dg) 18%,var(--card));border-left-color:var(--dg)}
.chip.dl{cursor:default;font-weight:600}
.more{border:0;background:none;color:var(--ac);font-size:11px;padding:2px}
.ar{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ar .an{flex:1;min-width:150px}
.sc{list-style:none;margin:0;padding-left:18px}
.sc.top{padding:0;max-height:200px;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:6px 8px}
#pv{max-height:150px;overflow:auto;font-size:12px;background:var(--bg);border-radius:8px;padding:8px;margin-top:8px}
dialog{border:1px solid var(--bd);border-radius:14px;padding:20px;width:min(520px,94vw);background:var(--card);color:var(--tx);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.4)}
.f{display:block;margin-bottom:10px}
.f>span{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
.f input:not([type=checkbox]),.f select{width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ft{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
details summary{cursor:pointer;color:var(--ac);margin:6px 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:inherit;text-decoration:underline;margin-left:8px}
svg.ln{width:100%;height:150px;background:var(--bg);border-radius:8px}
.bq{width:100%;border-collapse:collapse;font-size:13px}
.bq th{font-size:11px;font-weight:600;color:var(--mu);text-align:left;padding:4px 8px;white-space:nowrap}
.bq td{padding:6px 8px;border-top:1px solid var(--bd);white-space:nowrap}
.bq td:nth-child(2){white-space:normal;min-width:190px}
.bq tr.dim td{color:var(--mu)}
.fb{display:flex;align-items:center;gap:6px;width:150px}
.fb .bar{flex:1}
.tbl{overflow-x:auto}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px 28px}
.pp{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-bottom:6px}
.pill.ok{color:var(--ok);border-color:var(--ok)}
@media(max-width:760px){
#side{position:fixed;bottom:0;top:auto;left:0;right:0;width:auto;height:auto;flex-direction:row;padding:4px;z-index:20;border-top:1px solid var(--bd);border-right:0;overflow-x:auto}
.brand{display:none}
.nv{flex:1;text-align:center;font-size:12px;padding:8px 4px}
.gear{margin:0}.gear span{display:none}
main{padding:14px 12px 80px}
.cell{min-height:64px}
.chip span{font-size:10px}
.rp{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<nav id="side" aria-label="Main"></nav>
<main><header class="top"><h1 id="title"></h1><div id="acts" class="acts"></div></header><div id="view"></div></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
'use strict';
/* ---------- constants & helpers ---------- */
const K='syllabus-tracker-v1',TY=['subject','paper','chapter','topic'];
const ST={not_started:'Not started',ongoing:'Ongoing',completed:'Completed',skipped:'Skipped'};
const SC={not_started:'#a3a9b5',ongoing:'#d69a2d',completed:'#2f7d5b',skipped:'#7a8bb5'};
const PT={full:'Full syllabus',revision:'Revision',partial:'Partial',custom:'Custom'};
const NAV=[['dashboard','Dashboard','ড্যাশবোর্ড'],['syllabus','Syllabus','সিলেবাস'],['planner','Planner','পরিকল্পনা'],['calendar','Calendar','ক্যালেন্ডার'],['analytics','Analytics','বিশ্লেষণ'],['board','Board question analysis','বোর্ড প্রশ্ন বিশ্লেষণ']];
const PAL=['#2b4c7e','#c0623a','#2f7d5b','#a34f8f','#b08d1e','#3a8c9c','#7a5cc2','#c24f5e'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const pd=s=>new Date(s+'T00:00');
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const L=()=>S&&S.settings&&S.settings.lang==='bn'?'bn-BD':'en';
const fmt=s=>pd(s).toLocaleDateString(L(),{day:'numeric',month:'short'});
const fmtW=s=>pd(s).toLocaleDateString(L(),{weekday:'short',day:'numeric',month:'short'});
const uid=()=>Math.random().toString(36).slice(2,10);
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:0;
const PRI={high:0,med:1,low:2};

/* ---------- state ---------- */
const blank=()=>({items:[],plans:[],asg:[],revs:[],board:[],settings:{boardCover:80,name:'',exam:'',examDate:'',theme:'light',lang:'en',calc:'excl',perDay:0,restFri:false,lastBackup:0}});
function norm(o){
  if(!o||typeof o!=='object'||!Array.isArray(o.items))return null;
  const b=blank(),s={...b,...o,settings:{...b.settings,...(o.settings||{})}};
  ['plans','asg','revs'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[]});
  s.items=s.items.filter(i=>i&&i.id&&typeof i.name==='string'&&TY.includes(i.type));
  const ids=new Set(s.items.map(i=>i.id));
  s.items.forEach((i,n)=>{if(!ST[i.status])i.status='not_started';if(!ids.has(i.parentId))i.parentId='';if(typeof i.order!=='number')i.order=n;if(!ST[i.manual])i.manual=null});
  s.plans=s.plans.filter(p=>p&&p.id&&p.start&&p.deadline);
  s.plans.forEach(p=>{p.selectedItemIds=(p.selectedItemIds||[]).filter(x=>ids.has(x))});
  const pids=new Set(s.plans.map(p=>p.id));
  s.asg=s.asg.filter(a=>a&&ids.has(a.itemId)&&pids.has(a.planId)&&a.date);
  s.revs=s.revs.filter(r=>r&&ids.has(r.itemId));
  s.board=Array.isArray(s.board)?s.board.filter(r=>r&&ids.has(r.itemId)&&Array.isArray(r.sets)).map(r=>({...r,sets:r.sets.map(x=>Array.isArray(x)?x.map(Number).filter(Number.isInteger):[]).filter(x=>x.length)})):[];
  return s;
}
let S;try{S=norm(JSON.parse(localStorage.getItem(K)))||blank()}catch(e){S=blank()}
let route=location.hash.slice(1)||'dashboard',M,C,LC,ORD,RC,q='',flt='',openP=new Set();
let exp=new Set();try{exp=new Set(JSON.parse(localStorage.getItem(K+'-x')||'[]'))}catch(e){}
const cal={view:'month',date:today(),plan:'',subj:'',by:'subject'};
let an={sel:''};

function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Could not save — browser storage is full or blocked.')}}
function mut(fn,msg){const snap=JSON.stringify(S);fn();save();render();if(msg)toast(msg,snap)}
function toast(m,snap){const t=$('#toast');t.innerHTML=esc(m)+(snap?'<button data-a="undo">Undo</button>':'');t._s=snap;tr(t);t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),5500)}

/* ---------- index & progress ---------- */
function idx(){
  M=new Map();C={};LC=new Map();ORD=new Map();RC={};
  S.items.forEach(i=>M.set(i.id,i));
  S.items.forEach(i=>{const p=M.has(i.parentId)?i.parentId:'';(C[p]=C[p]||[]).push(i)});
  Object.values(C).forEach(a=>a.sort((x,y)=>x.order-y.order));
  let n=0;(function w(p){(C[p]||[]).forEach(i=>{ORD.set(i.id,n++);w(i.id)})})('');
  S.revs.forEach(r=>RC[r.itemId]=(RC[r.itemId]||0)+1);
}
const kids=id=>C[id]||[];
const roots=()=>kids('');
function lv(id){if(LC.has(id))return LC.get(id);const k=kids(id),r=k.length?k.flatMap(c=>lv(c.id)):[M.get(id)];LC.set(id,r);return r}
const allLv=()=>roots().flatMap(r=>lv(r.id));
function cnt(ls){const c={completed:0,ongoing:0,skipped:0,not_started:0,total:ls.length};ls.forEach(l=>c[l.status]++);return c}
const pc=(c,m)=>c.total?Math.round((c.completed+(m==='incl'?c.skipped:0))/c.total*100):0;
const prog=id=>pc(cnt(lv(id)),S.settings.calc);
function dstat(it){
  if(!kids(it.id).length)return it.status;
  if(it.manual)return it.manual;
  const c=cnt(lv(it.id));
  return c.not_started===c.total?'not_started':c.skipped===c.total?'skipped':c.completed+c.skipped===c.total?'completed':'ongoing';
}
function rootOf(id){let x=M.get(id);while(x&&x.parentId&&M.has(x.parentId))x=M.get(x.parentId);return x?x.id:''}
const colorOf=id=>{const r=M.get(rootOf(id));return(r&&r.color)||PAL[0]};
function path(id){const a=[];let x=M.get(id);while(x){a.unshift(x.name);x=M.get(x.parentId)}return a.join(' › ')}
const plan=id=>S.plans.find(p=>p.id===id);
const pcol=p=>PAL[S.plans.indexOf(p)%PAL.length];
const leafIds=ids=>{const s=new Set();ids.forEach(i=>M.get(i)&&lv(i).forEach(l=>s.add(l.id)));return[...s].sort((a,b)=>ORD.get(a)-ORD.get(b))};
const planLeaves=p=>{const s=new Set(leafIds(p.selectedItemIds));S.asg.forEach(a=>a.planId===p.id&&s.add(a.itemId));return[...s].filter(i=>M.has(i)).map(i=>M.get(i)).filter(l=>!(p.sys&&l.status==='skipped'))};

/* ---------- plan maths ---------- */
function idone(p,l){
  if(p.type==='revision')return S.revs.some(r=>r.itemId===l.id&&r.planId===p.id);
  return l.status==='completed'||(S.settings.calc==='incl'&&l.status==='skipped');
}
function adone(a){const p=plan(a.planId),it=M.get(a.itemId);return a.status==='done'||(p&&it&&(idone(p,it)||(p.sys&&it.status==='skipped')))}
function PS(p){
  const L=planLeaves(p),A=S.asg.filter(a=>a.planId===p.id),t=today();
  const tot=L.length,done=L.filter(l=>idone(p,l)).length,rem=tot-done;
  const over=A.filter(a=>!adone(a)&&a.date<t).length;
  const from=p.start>t?p.start:t,dl=Math.max(diff(from,p.deadline)+1,1);
  const dur=Math.max(diff(p.start,p.deadline)+1,1);
  const exp=A.length?new Set(A.filter(a=>a.date<t).map(a=>a.itemId)).size:Math.round(tot*Math.min(1,Math.max(0,diff(p.start,t)/dur)));
  let label,k='';
  if(!tot){label='No items'}else if(!rem){label='Complete';k='ok'}else if(t>p.deadline){label='Overdue';k='bad'}else if(t<p.start){label='Not started'}else if(done>=exp&&!over){label='On track';k='ok'}else{label='Behind';k='bad'}
  return{tot,done,rem,over,exp,label,k,pct:tot?Math.round(done/tot*100):0,pace:rem?(Math.ceil(rem/dl*10)/10):0};
}
function sched(ids,start,end,perDay,restFri){
  let days=[];if(end<start||diff(start,end)>3650)return{out:[],days,warn:'Deadline must fall on or after the start date.'};
  for(let d=start;d<=end;d=addD(d,1))days.push(d);
  if(restFri){const w=days.filter(d=>pd(d).getDay()!==5);if(w.length)days=w}
  const n=ids.length,out=[];let warn='';
  ids.forEach((id,i)=>{
    let k=perDay>0?Math.floor(i/perDay):Math.floor(i*days.length/n);
    if(k>=days.length){k=days.length-1;warn='The daily target is too low to finish by the deadline — extra items land on the last day.'}
    out.push({itemId:id,date:days[k]});
  });
  return{out,days,warn};
}
function makePlan(o){
  const p={id:uid(),name:o.name,type:o.type,desc:o.desc||'',start:o.start,deadline:o.deadline,selectedItemIds:o.ids,mode:o.mode,perDay:o.perDay||0,restFri:!!o.restFri,createdAt:Date.now(),updatedAt:Date.now()};
  if(o.s)p.s=1;
  if(o.sys)p.sys=o.sys;
  S.plans.push(p);
  if(o.mode!=='manual')sched(leafIds(o.ids),o.start,o.deadline,p.perDay,p.restFri).out.forEach(x=>S.asg.push({id:uid(),planId:p.id,itemId:x.itemId,date:x.date,status:'pending',priority:'med',dur:0}));
  return p;
}
function purge(set){
  S.items=S.items.filter(i=>!set.has(i.id));
  S.asg=S.asg.filter(a=>!set.has(a.itemId));
  S.revs=S.revs.filter(r=>!set.has(r.itemId));
  S.board=(S.board||[]).filter(r=>!set.has(r.itemId));
  S.plans.forEach(p=>p.selectedItemIds=p.selectedItemIds.filter(x=>!set.has(x)));
}
const descIds=id=>{const s=new Set([id]);(function w(i){kids(i).forEach(k=>{s.add(k.id);w(k.id)})})(id);return s};

/* ---------- small ui parts ---------- */
const empty=(t,d,b)=>`<div class="empty"><h3>${t}</h3><p class="mu">${d}</p>${b}</div>`;
const bar=(p,c)=>`<div class="bar"><i style="width:${p}%;background:${c}"></i></div>`;
function bar2(c,col){const t=c.total||1;return`<div class="bar"><i style="width:${c.completed/t*100}%;background:${col}"></i><i class="sk" style="width:${c.skipped/t*100}%;background:${col}"></i></div>`}
const seg=()=>`<span class="seg" role="group" aria-label="Progress calculation"><button data-a="calc" data-v="excl" class="${S.settings.calc==='excl'?'on':''}">Excl. skipped</button><button data-a="calc" data-v="incl" class="${S.settings.calc==='incl'?'on':''}">Incl. skipped</button></span>`;
const ckb=a=>`<button class="ck${adone(a)?' on':''}" data-a="asgtog" data-id="${a.id}" aria-label="Mark done">${adone(a)?'✓':''}</button>`;

/* ---------- dialogs ---------- */
function dlg(title,body,ok,onSave,extra){
  const d=$('#dlg');d._re=true;
  d.innerHTML=`<form onsubmit="return false"><h2>${title}</h2>${body}<div class="ft">${extra||''}<span class="sp"></span><button type="button" class="btn2" data-a="close">${ok?'Cancel':'Close'}</button>${ok?`<button type="button" class="btn" data-a="save">${ok}</button>`:''}</div></form>`;

const boardTargets=()=>S.items.filter(i=>kids(i.id).length&&(i.type==='paper'||(i.type==='subject'&&!kids(i.id).some(k=>k.type==='paper')))).sort((a,b)=>ORD.get(a.id)-ORD.get(b.id));
function BQ(pid){
  const ch=kids(pid),recs=S.board.filter(r=>r.itemId===pid),cover=(+S.settings.boardCover||80)/100;
  const freq=ch.map(()=>0),sets=ch.map(()=>0),yr={};let ns=0,total=0;
  recs.forEach(r=>r.sets.forEach(st=>{
    ns++;const seen=new Set();
    st.forEach(n=>{if(n>=1&&n<=ch.length){freq[n-1]++;total++;seen.add(n-1);(yr[r.year]=yr[r.year]||ch.map(()=>0))[n-1]++}});
    seen.forEach(i=>sets[i]++);
  }));
  const rows=ch.map((it,i)=>({it,n:i+1,f:freq[i],s:sets[i]})).sort((a,b)=>b.f-a.f||a.n-b.n);
  let cum=0,cutF=Infinity;
  if(total)for(const r of rows){if(!r.f)break;cum+=r.f;cutF=r.f;if(cum/total>=cover-1e-9)break}
  rows.forEach(r=>{r.rank=rows.findIndex(x=>x.f===r.f)+1;r.imp=total>0&&r.f>0&&r.f>=cutF});
  return{rows,total,ns,recs,yr,years:Object.keys(yr).sort()};
}
function planSkip(pids){
  const L=[];
  pids.forEach(pid=>{const b=BQ(pid);if(b.total)b.rows.forEach(r=>{if(!r.imp)lv(r.it.id).forEach(l=>{if(l.status==='not_started')L.push(l)})})});
  return L;
}
function doSkip(pids){
  if(!pids.some(p=>BQ(p).total))return toast('Add past-paper analysis first.');
  const L=planSkip(pids);
  if(!L.length)return toast('Nothing to skip — the other chapters are already skipped or in progress.');
  mut(()=>L.forEach(l=>{l.status='skipped';l.completedAt=null;l.updatedAt=Date.now()}),'Skipped '+L.length+' items outside the important chapters.');
}
function paperBlock(pp){

}

function seedBoard(){

const remNew=p=>{const cur=new Set(planLeaves(p).map(l=>l.id));return remainingLeaves().filter(l=>!cur.has(l.id))};
function remCard(){
  const L=remainingLeaves(),all=allLv(),sk=all.filter(l=>l.status==='skipped').length,dn=all.filter(l=>l.status==='completed').length;
  const by=roots().map(r=>{const ls=lv(r.id);return{r,t:ls.length,n:ls.filter(l=>l.status!=='completed'&&l.status!=='skipped').length}}).filter(x=>x.n);
  return`<section class="card"><div class="top" style="margin:0 0 8px"><div><h3 style="margin:0">Remaining syllabus <i class="pill">Built-in</i></h3><small>Everything that is neither completed nor skipped</small></div>${L.length?'<button class="btn" data-a="remplan">Set a timeline and create plan</button>':''}</div>${L.length?`<div class="cnts"><div><b>${L.length}</b>Items left</div><div><b>${dn}</b>Completed</div><div><b>${sk}</b>Skipped</div></div>${by.map(x=>`<div class="lr"><b>${esc(x.r.name)} <small>${x.n} left of ${x.t}</small></b><span class="mu">${Math.round(x.n/x.t*100)}%</span>${bar(x.n/x.t*100,colorOf(x.r.id))}</div>`).join('')}`:'<p class="mu">Nothing left — every item is completed or skipped.</p>'}</section>`;
}
function openRemaining(){
  const L=remainingLeaves();if(!L.length)return toast('Nothing left — every item is completed or skipped.');
  const t=today(),c=S.settings,end=c.examDate&&c.examDate>t?c.examDate:addD(t,30);
  dlg('Plan the remaining syllabus',
    `<p class="mu">${L.length} items are neither completed nor skipped. Choose a timeline to spread them over.</p>`+
    `<div class="f2">${fld('Start',`<input type="date" name="start" required value="${t}">`)}${fld('Deadline',`<input type="date" name="deadline" required value="${end}">`)}</div>`+
    `<div class="f2">${fld('Scheduling',`<select name="mode">${opts({auto:'Automatic',hybrid:'Hybrid (auto, then edit)',manual:'Manual'},'auto')}</select>`)}${fld('Daily target (items, optional)',`<input type="number" min="0" name="perDay" value="${c.perDay||''}">`)}</div>`+
    fld('Rest on Fridays','<input type="checkbox" name="restFri"'+(c.restFri?' checked':'')+'>')+'<div id="pv" class="mu"></div>',
    'Create plan',d=>{
      const st=d.get('start'),dl=d.get('deadline');
      if(dl<st){toast('Deadline must be on or after the start date.');return false}
      const ids=remainingLeaves().map(l=>l.id);
      mut(()=>{const np=makePlan({name:'Remaining syllabus',type:'custom',desc:'Everything that was neither completed nor skipped when this plan was made.',start:st,deadline:dl,ids,mode:d.get('mode'),perDay:+d.get('perDay')||0,restFri:!!d.get('restFri'),sys:'remaining'});openP.add(np.id)},'Plan created');
    });
  $('#dlg form').dataset.rem='1';pv();
}
function syncRemaining(id){
  const p=plan(id),t=today();
  if(p.deadline<t)return toast('The deadline has passed — extend it with Edit first.');
  const add=remNew(p).map(l=>l.id);
  mut(()=>{
    p.selectedItemIds=[...new Set([...p.selectedItemIds,...add])];
    S.asg=S.asg.filter(a=>!(a.planId===p.id&&M.get(a.itemId).status==='skipped'));
    unsched(p).forEach(l=>S.asg.push({id:uid(),planId:p.id,itemId:l.id,date:p.deadline,status:'pending',priority:'med',dur:0}));
    const pend=S.asg.filter(a=>a.planId===p.id&&!adone(a)).sort((a,b)=>ORD.get(a.itemId)-ORD.get(b.itemId));
    const r=sched(pend.map(a=>a.itemId),p.start>t?p.start:t,p.deadline,+p.perDay||0,p.restFri);
    pend.forEach((a,i)=>{if(r.out[i])a.date=r.out[i].date});
    p.updatedAt=Date.now();
  },'Synced with the remaining syllabus');
}

const DG='০১২৩৪৫৬৭৮৯',bd=s=>s.replace(/\d/g,d=>DG[d]);
function trStr(s){
  const t=s.trim();if(!t)return s;
  let o;
  if(t.includes(' › '))o=t.split(' › ').map(x=>trStr(x)).join(' › ');
  else if(BN[t]!=null)o=BN[t];
  else{o=t;for(const[re,f]of PAT)o=o.replace(re,f);for(const k of LK)if(o.includes(k))o=o.split(k).join(BN[k])}
  return s.replace(t,()=>o);
}
function tr(root){
  if(!root||S.settings.lang!=='bn')return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];
  while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{const p=n.parentNode&&n.parentNode.nodeName;if(p==='SCRIPT'||p==='STYLE'||p==='TEXTAREA')return;n.nodeValue=bd(trStr(n.nodeValue))});
  root.querySelectorAll('[placeholder],[aria-label],[title],[label]').forEach(e=>['placeholder','aria-label','title','label'].forEach(a=>{const v=e.getAttribute(a);if(v)e.setAttribute(a,trStr(v))}));
}

function syncDefault(){
  const now=Date.now();
  const kid=p=>S.items.filter(i=>i.parentId===p).sort((a,b)=>a.order-b.order);
  const mk=(name,type,parentId,order,o)=>{const it={id:uid(),name,type,parentId,order,status:'not_started',manual:null,notes:'',difficulty:'',color:'',createdAt:now,updatedAt:now,completedAt:null,...o};S.items.push(it);return it};
  const ph=c=>/^Chapter \d+$/.test(c.name);
  DEF.forEach(([n,ps])=>{
    let sub=S.items.find(i=>!i.parentId&&i.name===n);
    if(!sub){const r=kid('').length;sub=mk(n,'subject','',r,{color:PAL[r%PAL.length]})}
    ps.forEach((list,pi)=>{
      const pn=['1st','2nd'][pi]+' Paper';
      const pp=kid(sub.id).find(x=>x.name===pn)||mk(pn,'paper',sub.id,kid(sub.id).length);
      const cur=kid(pp.id);
      list.forEach((e,k)=>{
        const[t,notes,tp]=Array.isArray(e)?e:[e];
        const nm=t[0]==='='?t.slice(1):'Chapter '+(k+1)+': '+t;
        let c=cur[k];
        if(!c)c=mk(nm,'chapter',pp.id,k);else if(ph(c)){c.name=nm;c.updatedAt=now}
        if(notes&&!c.notes)c.notes=notes;
        (tp||[]).forEach(x=>{if(!kid(c.id).some(y=>y.name===x))mk(x,'topic',c.id,kid(c.id).length)});
      });
      cur.slice(list.length).forEach(c=>{if(ph(c)&&c.status==='not_started'&&!kid(c.id).length&&!S.revs.some(r=>r.itemId===c.id)&&!S.asg.some(a=>a.itemId===c.id))purge(new Set([c.id]))});
    });
  });
  S.defVer=2;
}
